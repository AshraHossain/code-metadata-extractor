[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-metadata"
version = "0.1.0"
description = "Python repository metadata extractor — AST-based, no LLM"
requires-python = ">=3.11"
dependencies = [
    "radon>=6.0",
    "gitpython>=3.1",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
code-metadata = "code_metadata.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
llm = [
    "anthropic>=0.34",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=code_metadata --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/code_metadata"]
